name: Publish dashboard to grafana.com
description: Publishes a dashboard to grafana.com and keeps its page up to date from the files in your repository
author: moonD4rk

branding:
  icon: upload-cloud
  color: blue

inputs:
  dashboard-id:
    description: "The dashboard's ID on grafana.com: the number in its URL"
    required: true
  token:
    description: A Grafana Cloud access policy token with the dashboards:write scope. Without it the run is a dry run
    required: false
  dashboard-file:
    description: The dashboard JSON, published as a new revision when it changed
    required: false
  name:
    description: The name on the dashboard's page
    required: false
  description:
    description: "The short description on the dashboard's page. Default: the description inside the dashboard file"
    required: false
  readme-file:
    description: A Markdown file for the page's README
    required: false
  screenshots:
    description: Image files or globs, one per line, in the order to show them
    required: false
  logo:
    description: A PNG or JPEG file for the logo
    required: false
  categories:
    description: Category slugs, one per line, such as docker
    required: false
  collector-type:
    description: "The collector that feeds the dashboard: collectd, nodeExporter, Snap, Telegraf, Beats, Icinga or Other"
    required: false
  collector-plugins:
    description: The collector's plugins, one per line
    required: false
  collector-config:
    description: A text on how to set the collector up
    required: false
  dry-run:
    description: true publishes nothing and reports what would change. false fails when the token is missing
    required: false

outputs:
  changed:
    description: true when something was published, or would have been in a dry run
  changes:
    description: What changed, comma-separated, such as revision,readme,screenshots
  revision:
    description: The latest revision number after the run
  url:
    description: The dashboard's page on grafana.com

runs:
  using: node24
  main: dist/index.js
